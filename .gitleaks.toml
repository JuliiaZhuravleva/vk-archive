# Конфигурация gitleaks для vk-archive.
#
#   gitleaks dir . --config .gitleaks.toml       # текущее состояние файлов
#   gitleaks git . --config .gitleaks.toml       # вся история коммитов
#
# Наследуем встроенный набор правил и только сужаем его: писать свои
# регулярки поверх стандартных незачем, а вот область поиска ограничить
# обязательно — без этого прогон уходит в data/ (десятки гигабайт архива)
# и в .venv, где лежат чужие тестовые ключи из зависимостей. Такой прогон
# идёт минутами и заканчивается кучей находок, к нашему коду отношения
# не имеющих.

[extend]
useDefault = true

[allowlist]
description = "Пути и заведомо несекретные значения"

# Каталоги вне репозитория. Дублируют .gitignore намеренно: gitleaks в
# режиме `dir` про .gitignore не знает и читает всё подряд.
paths = [
  '''^data/''',
  '''^\.venv/''',
  '''^\.git/''',
  '''^__pycache__/''',
  '''\.pyc$''',
  '''^Archive.*\.zip$''',
  # Рабочие заметки не публикуются (см. .gitignore), но лежат рядом
  # и без этого попадают под сканирование.
  '''^_registry\.md$''',
  '''^_tech-debt\.md$''',
  '''^HANDOFF.*\.md$''',
]

# Пароль локальной базы. Не секрет по устройству: Postgres слушает только
# 127.0.0.1, а данные, которые он хранит, лежат тут же на диске в открытом
# виде. Держать его в переменной окружения смысла нет — защищать нечего,
# а скрипты стали бы неудобнее.
#
# Проверено 02.08.2026: сейчас это правило ни на что не влияет — встроенные
# правила gitleaks на такую строку и без него не срабатывают (энтропия
# низкая, формат libpq им незнаком). Запись оставлена как объявление
# намерения: если правила поменяются и строка начнёт всплывать, находка
# будет уже разобранной, а не новой.
regexes = [
  '''vk_local_only''',
]
